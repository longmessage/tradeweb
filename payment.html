<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付页面 - GlobalTrade Pro</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: #f5f7fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .payment-container { background: white; border-radius: 20px; overflow: hidden; max-width: 500px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.1); }
        .payment-header { background: linear-gradient(135deg, #f59e0b, #d97706); padding: 30px; text-align: center; color: white; }
        .payment-header h1 { font-size: 1.5rem; margin-bottom: 8px; }
        .payment-body { padding: 30px; }
        
        .order-info { background: #f8fafc; border-radius: 12px; padding: 20px; margin-bottom: 25px; }
        .order-info .plan-name { font-size: 1.2rem; font-weight: 600; margin-bottom: 10px; }
        .order-info .plan-price { font-size: 2rem; font-weight: 700; color: #f59e0b; }
        .order-info .plan-price span { font-size: 1rem; color: #6b7280; }
        
        .payment-methods { margin-bottom: 25px; }
        .payment-methods h3 { font-size: 1rem; margin-bottom: 15px; }
        .method-options { display: flex; gap: 12px; }
        .method-option { flex: 1; padding: 15px; border: 2px solid #e5e7eb; border-radius: 10px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .method-option:hover { border-color: #3b82f6; }
        .method-option.selected { border-color: #3b82f6; background: #eff6ff; }
        .method-option i { font-size: 1.5rem; margin-bottom: 8px; display: block; }
        .method-option .name { font-weight: 500; }
        
        .pay-btn { width: 100%; padding: 18px; background: linear-gradient(135deg, #f59e0b, #d97706); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s; }
        .pay-btn:hover { transform: translateY(-2px); }
        
        .back-link { display: block; text-align: center; margin-top: 20px; color: #6b7280; text-decoration: none; }
        .back-link:hover { color: #3b82f6; }
        
        .alert { padding: 14px 18px; border-radius: 10px; margin-bottom: 20px; display: none; }
        .alert.show { display: block; }
        .alert.success { background: #d1fae5; color: #065f46; }
        .alert.processing { background: #fef3c7; color: #92400e; }
    </style>
</head>
<a href="index.html" style="position:fixed;bottom:80px;right:20px;z-index:9999;background:#3b82f6;color:white;padding:10px 20px;border-radius:8px;text-decoration:none;"><i class="fas fa-home"></i> 返回首页</a>
<body>
    <div class="payment-container">
        <div class="payment-header">
            <h1><i class="fas fa-shopping-cart"></i> 确认订单</h1>
            <p>升级您的会员套餐</p>
        </div>
        
        <div class="payment-body">
            <div class="alert" id="alert"></div>
            
            <div class="order-info" id="orderInfo">
                <div class="plan-name" id="planName">基础版</div>
                <div class="plan-price" id="planPrice">¥99<span>/月</span></div>
            </div>
            
            <div class="payment-methods">
                <h3>支付方式</h3>
                <div class="method-options">
                    <div class="method-option selected" data-method="wechat" onclick="selectMethod(this)">
                        <i class="fab fa-weixin" style="color:#07c160"></i>
                        <div class="name">微信支付</div>
                    </div>
                    <div class="method-option" data-method="alipay" onclick="selectMethod(this)">
                        <i class="fab fa-alipay" style="color:#1677ff"></i>
                        <div class="name">支付宝</div>
                    </div>
                    <div class="method-option" data-method="card" onclick="selectMethod(this)">
                        <i class="fas fa-credit-card" style="color:#6366f1"></i>
                        <div class="name">银行卡</div>
                    </div>
                </div>
            </div>
            
            <button class="pay-btn" onclick="processPayment()">
                <i class="fas fa-lock"></i> 立即支付
            </button>
            
            <a href="member.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回会员中心</a>
        </div>
    </div>

    <script>
        const plans = {
            basic: { name: '基础版', price: 99 },
            pro: { name: '专业版', price: 299 }
        };
        
        // 获取 URL 参数
        const urlParams = new URLSearchParams(window.location.search);
        const planKey = urlParams.get('plan') || 'basic';
        
        // 显示套餐信息
        document.getElementById('planName').textContent = plans[planKey].name;
        document.getElementById('planPrice').innerHTML = '¥' + plans[planKey].price + '<span>/月</span>';
        
        let selectedMethod = 'wechat';
        
        function selectMethod(el) {
            document.querySelectorAll('.method-option').forEach(m => m.classList.remove('selected'));
            el.classList.add('selected');
            selectedMethod = el.dataset.method;
        }
        
        function processPayment() {
            const alert = document.getElementById('alert');
            
            // 显示支付中提示
            alert.className = 'alert show processing';
            alert.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 支付处理中，请稍候...';
            
            // 模拟支付成功
            setTimeout(() => {
                // 更新用户套餐
                const user = JSON.parse(localStorage.getItem('tradeweb_user') || '{}');
                user.plan = planKey;
                localStorage.setItem('tradeweb_user', JSON.stringify(user));
                
                alert.className = 'alert show success';
                alert.innerHTML = '<i class="fas fa-check-circle"></i> 支付成功！正在跳转到会员中心...';
                
                setTimeout(() => {
                    window.location.href = 'member.html';
                }, 2000);
            }, 2500);
        }
    </script>
</body>
</html>
