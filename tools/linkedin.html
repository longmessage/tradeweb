<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn拓客 - GlobalTrade Pro</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .tool-container { max-width: 900px; margin: 40px auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 40px; }
        .tool-header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .tool-header p { color: #666; font-size: 1.1rem; }
        .tool-card { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        .pro-badge { display: inline-block; background: linear-gradient(135deg, #f59e0b, #d97706); color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; margin-left: 10px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #374151; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 15px; transition: border-color 0.3s; font-family: inherit; box-sizing: border-box; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #0a66c2; }
        .form-group textarea { min-height: 100px; resize: vertical; }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .search-btn { width: 100%; padding: 18px; background: linear-gradient(135deg, #0a66c2, #004182); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s; }
        .search-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(10,102,194,0.3); }
        
        .results-section { display: none; margin-top: 30px; }
        .results-section.active { display: block; }
        
        .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .results-header h3 { color: #0a66c2; }
        
        .profile-card { display: flex; gap: 15px; padding: 20px; border: 1px solid #e5e7eb; border-radius: 12px; margin-bottom: 15px; transition: all 0.2s; }
        .profile-card:hover { border-color: #0a66c2; box-shadow: 0 4px 12px rgba(10,102,194,0.1); }
        .profile-avatar { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #0a66c2, #004182); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 600; flex-shrink: 0; }
        .profile-info { flex: 1; }
        .profile-name { font-weight: 600; font-size: 1.1rem; margin-bottom: 5px; color: #0a66c2; }
        .profile-title { color: #666; font-size: 0.9rem; margin-bottom: 5px; }
        .profile-company { color: #666; font-size: 0.85rem; }
        .profile-actions { display: flex; gap: 10px; margin-top: 10px; }
        .profile-actions button { padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
        .btn-connect { background: #0a66c2; color: white; border: none; }
        .btn-connect:hover { background: #004182; }
        .btn-message { background: white; border: 1px solid #0a66c2; color: #0a66c2; }
        .btn-message:hover { background: #f3f6f8; }
        
        .locked-tip { background: #fef3c7; border: 1px solid #fcd34d; padding: 20px; border-radius: 12px; margin-top: 20px; text-align: center; }
        .locked-tip a { color: #d97706; font-weight: 600; }
        
        .loading { text-align: center; padding: 40px; display: none; }
        .loading.active { display: block; }
        .spinner { width: 50px; height: 50px; border: 4px solid #e5e7eb; border-top-color: #0a66c2; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-item { background: #f8fafc; padding: 15px; border-radius: 10px; text-align: center; }
        .stat-item .value { font-size: 1.5rem; font-weight: 700; color: #0a66c2; }
        .stat-item .label { font-size: 0.8rem; color: #666; }
        
        .search-filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .filter-tag { padding: 6px 14px; background: #f3f4f6; border-radius: 20px; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
        .filter-tag:hover, .filter-tag.active { background: #0a66c2; color: white; }
    </style>
</head>
<body style="background: #f5f7fa;">
    <a href="../tools.html" class="back-btn" style="position:fixed;bottom:80px;right:20px;z-index:9999;background:#3b82f6;color:white;padding:10px 20px;border-radius:8px;text-decoration:none;"><i class="fas fa-home"></i> 返回首页</a>
    
    <div class="tool-container">
        <div class="tool-header">
            <h1><i class="fab fa-linkedin" style="color: #0a66c2;"></i> LinkedIn 拓客工具 <span class="pro-badge">基础版</span></h1>
            <p>搜索并联系潜在客户，扩大你的外贸业务网络</p>
        </div>
        
        <div class="tool-card">
            <div class="form-row">
                <div class="form-group">
                    <label>关键词</label>
                    <input type="text" id="searchKeyword" placeholder="例如: CEO, Purchasing Manager, Import">
                </div>
                <div class="form-group">
                    <label>行业</label>
                    <input type="text" id="searchIndustry" placeholder="例如: Manufacturing, Tech, Trading">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>公司名称</label>
                    <input type="text" id="searchCompany" placeholder="目标公司名称">
                </div>
                <div class="form-group">
                    <label>地区</label>
                    <select id="searchLocation">
                        <option value="">全球</option>
                        <option value="US">美国</option>
                        <option value="UK">英国</option>
                        <option value="DE">德国</option>
                        <option value="FR">法国</option>
                        <option value="CN">中国</option>
                        <option value="AU">澳大利亚</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label>快速筛选</label>
                <div class="search-filters">
                    <span class="filter-tag active" data-filter="all">全部</span>
                    <span class="filter-tag" data-filter="ceo">CEO/决策人</span>
                    <span class="filter-tag" data-filter="purchasing">采购负责人</span>
                    <span class="filter-tag" data-filter="sales">销售/市场</span>
                    <span class="filter-tag" data-filter="engineer">技术/工程师</span>
                </div>
            </div>
            
            <button class="search-btn" onclick="searchProfiles()">
                <i class="fas fa-search"></i> 搜索潜在客户
            </button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在搜索 LinkedIn  profiles...</p>
            </div>
            
            <div class="results-section" id="results">
                <div class="results-header">
                    <h3><i class="fas fa-users"></i> 搜索结果</h3>
                    <div class="stats-row">
                        <div class="stat-item">
                            <div class="value" id="totalResults">0</div>
                            <div class="label">总人数</div>
                        </div>
                        <div class="stat-item">
                            <div class="value" id="decisionMakers">0</div>
                            <div class="label">决策人</div>
                        </div>
                        <div class="stat-item">
                            <div class="value" id="connected">0</div>
                            <div class="label">已发送</div>
                        </div>
                        <div class="stat-item">
                            <div class="value" id="replied">0</div>
                            <div class="label">已回复</div>
                        </div>
                    </div>
                </div>
                
                <div id="profilesList"></div>
            </div>
            
            <div class="locked-tip" id="lockedTip" style="display: none;">
                🔒 此功能仅对基础版及以上会员开放<br>
                <a href="../payment.html?plan=basic">立即升级到基础版</a>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        // 检查登录状态
        const loggedIn = localStorage.getItem('tradeweb_logged_in');
        if (!loggedIn) {
            alert('请先登录后使用工具');
            window.location.href = '../login.html';
        }
        
        // 检查会员等级
        const currentUser = JSON.parse(localStorage.getItem('tradeweb_current_user') || '{}');
        const userRole = localStorage.getItem('tradeweb_user_role');
        let userPlan = currentUser.plan || 'free';
        if (userRole === 'admin') {
            userPlan = 'pro';
        }
        
        // 如果不是基础版或专业版，显示提示
        if (userPlan === 'free') {
            document.getElementById('lockedTip').style.display = 'block';
            document.querySelector('.search-btn').disabled = true;
        }
        
        // 筛选标签
        document.querySelectorAll('.filter-tag').forEach(tag => {
            tag.addEventListener('click', function() {
                document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
            });
        });
        
        // 搜索功能
        function searchProfiles() {
            if (userPlan === 'free') {
                alert('此功能仅对基础版及以上会员开放');
                return;
            }
            
            const keyword = document.getElementById('searchKeyword').value.trim();
            const industry = document.getElementById('searchIndustry').value.trim();
            const company = document.getElementById('searchCompany').value.trim();
            
            if (!keyword && !industry && !company) {
                alert('请至少填写一个搜索条件');
                return;
            }
            
            document.getElementById('loading').classList.add('active');
            document.getElementById('results').classList.remove('active');
            
            // 模拟搜索结果
            setTimeout(() => {
                const mockProfiles = [
                    { name: 'John Smith', title: 'CEO', company: 'ABC Manufacturing', location: 'United States', connected: false },
                    { name: 'Maria Garcia', title: 'Purchasing Director', company: 'Tech Solutions Inc', location: 'Spain', connected: false },
                    { name: 'David Chen', title: 'Import Manager', company: 'Global Trade Co', location: 'Canada', connected: false },
                    { name: 'Emma Wilson', title: 'Sales Manager', company: 'Euro Products', location: 'Germany', connected: false },
                    { name: 'James Brown', title: 'Procurement Manager', company: 'Pacific Trading', location: 'Australia', connected: false },
                    { name: 'Lisa Zhang', title: 'CEO', company: 'Shanghai Electronics', location: 'China', connected: false },
                    { name: 'Michael Johnson', title: 'Engineering Lead', company: 'Innovate Tech', location: 'United States', connected: false },
                    { name: 'Sophie Martin', title: 'Business Development', company: 'French Imports', location: 'France', connected: false }
                ];
                
                // 过滤
                let filtered = mockProfiles;
                const activeFilter = document.querySelector('.filter-tag.active').dataset.filter;
                
                if (activeFilter === 'ceo') {
                    filtered = mockProfiles.filter(p => p.title.toLowerCase().includes('ceo') || p.title.toLowerCase().includes('director'));
                } else if (activeFilter === 'purchasing') {
                    filtered = mockProfiles.filter(p => p.title.toLowerCase().includes('purchasing') || p.title.toLowerCase().includes('procurement') || p.title.toLowerCase().includes('import'));
                } else if (activeFilter === 'sales') {
                    filtered = mockProfiles.filter(p => p.title.toLowerCase().includes('sales') || p.title.toLowerCase().includes('business'));
                } else if (activeFilter === 'engineer') {
                    filtered = mockProfiles.filter(p => p.title.toLowerCase().includes('engineer') || p.title.toLowerCase().includes('technical'));
                }
                
                renderProfiles(filtered);
                
                document.getElementById('loading').classList.remove('active');
                document.getElementById('results').classList.add('active');
            }, 2000);
        }
        
        function renderProfiles(profiles) {
            document.getElementById('totalResults').textContent = profiles.length;
            
            const decisionMakers = profiles.filter(p => p.title.toLowerCase().includes('ceo') || p.title.toLowerCase().includes('director') || p.title.toLowerCase().includes('manager'));
            document.getElementById('decisionMakers').textContent = decisionMakers.length;
            
            const connected = profiles.filter(p => p.connected).length;
            document.getElementById('connected').textContent = connected;
            document.getElementById('replied').textContent = Math.floor(connected * 0.3);
            
            const html = profiles.map((p, idx) => `
                <div class="profile-card">
                    <div class="profile-avatar">${p.name.charAt(0)}</div>
                    <div class="profile-info">
                        <div class="profile-name">${p.name}</div>
                        <div class="profile-title">${p.title}</div>
                        <div class="profile-company"><i class="fas fa-building"></i> ${p.company} | <i class="fas fa-map-marker-alt"></i> ${p.location}</div>
                        <div class="profile-actions">
                            <button class="btn-connect" onclick="connectProfile(${idx})">
                                <i class="fas fa-user-plus"></i> ${p.connected ? '已发送' : '添加好友'}
                            </button>
                            <button class="btn-message" onclick="messageProfile(${idx})">
                                <i class="fas fa-envelope"></i> 发送消息
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
            
            document.getElementById('profilesList').innerHTML = html;
        }
        
        function connectProfile(idx) {
            const profiles = document.querySelectorAll('.profile-card');
            const btn = profiles[idx].querySelector('.btn-connect');
            
            if (btn.textContent.includes('已发送')) {
                alert('已经发送过好友请求了');
                return;
            }
            
            btn.innerHTML = '<i class="fas fa-check"></i> 已发送';
            btn.style.background = '#10b981';
            
            const current = parseInt(document.getElementById('connected').textContent);
            document.getElementById('connected').textContent = current + 1;
            
            alert('好友请求已发送！');
        }
        
        function messageProfile(idx) {
            alert('消息功能开发中...\n\n你可以先发送好友请求，添加成功后可以发送私信。');
        }
    </script>
</body>
</html>
