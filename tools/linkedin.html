<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn拓客 - GlobalTrade Pro</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .tool-container { max-width: 900px; margin: 40px auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 40px; }
        .tool-header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .tool-header p { color: #666; font-size: 1.1rem; }
        .tool-card { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        .pro-badge { display: inline-block; background: linear-gradient(135deg, #f59e0b, #d97706); color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; margin-left: 10px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #374151; }
        .form-group input, .form-group select { width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 15px; transition: border-color 0.3s; font-family: inherit; box-sizing: border-box; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #0a66c2; }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .search-btn { width: 100%; padding: 18px; background: linear-gradient(135deg, #0a66c2, #004182); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s; }
        .search-btn:hover { transform: translateY(-2px); }
        
        .results-section { display: none; margin-top: 30px; }
        .results-section.active { display: block; }
        
        .profile-card { display: flex; gap: 15px; padding: 20px; border: 1px solid #e5e7eb; border-radius: 12px; margin-bottom: 15px; cursor: pointer; transition: all 0.2s; }
        .profile-card:hover { border-color: #0a66c2; }
        .profile-card.selected { border-color: #7c3aed; box-shadow: 0 4px 12px rgba(124,58,237,0.2); }
        .profile-avatar { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #0a66c2, #004182); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 600; flex-shrink: 0; }
        .profile-info { flex: 1; }
        .profile-name { font-weight: 600; font-size: 1.1rem; margin-bottom: 5px; color: #0a66c2; }
        .profile-title { color: #666; font-size: 0.9rem; margin-bottom: 5px; }
        .profile-company { color: #666; font-size: 0.85rem; }
        
        .btn-connect { padding: 8px 16px; background: #0a66c2; color: white; border: none; border-radius: 8px; font-size: 0.85rem; cursor: pointer; }
        
        .locked-tip { background: #fef3c7; border: 1px solid #fcd34d; padding: 20px; border-radius: 12px; margin-top: 20px; text-align: center; }
        
        .loading { text-align: center; padding: 40px; display: none; }
        .loading.active { display: block; }
        .spinner { width: 50px; height: 50px; border: 4px solid #e5e7eb; border-top-color: #0a66c2; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-item { background: #f8fafc; padding: 15px; border-radius: 10px; text-align: center; }
        .stat-item .value { font-size: 1.5rem; font-weight: 700; color: #0a66c2; }
        .stat-item .label { font-size: 0.8rem; color: #666; }
        
        .filter-tag { padding: 6px 14px; background: #f3f4f6; border-radius: 20px; font-size: 0.85rem; cursor: pointer; margin-right: 8px; }
        .filter-tag.active { background: #0a66c2; color: white; }
        
        .ai-section { margin-top: 30px; padding-top: 30px; border-top: 2px dashed #e5e7eb; }
        .ai-btn { background: linear-gradient(135deg, #7c3aed, #5b21b6); }
        
        .report-card { background: linear-gradient(135deg, #1e3a5f, #2d5a87); color: white; padding: 25px; border-radius: 12px; }
        .report-card h4 { color: white; margin-bottom: 20px; font-size: 1.3rem; }
        .report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .report-stat { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; text-align: center; }
        .report-stat .value { font-size: 2rem; font-weight: bold; color: #10b981; }
        .report-stat .label { font-size: 0.85rem; opacity: 0.8; }
        .report-section { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .report-section .label { font-size: 0.85rem; opacity: 0.8; margin-bottom: 8px; }
        .report-section .content { font-weight: 600; }
        .report-message { background: white; color: #333; padding: 15px; border-radius: 8px; margin-bottom: 15px; line-height: 1.6; }
        .followup-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .followup-item { background: rgba(255,255,255,0.1); padding: 12px; border-radius: 6px; text-align: center; }
        .followup-item .day { font-weight: 600; color: #10b981; }
        .followup-item .action { font-size: 0.75rem; opacity: 0.8; }
        
        .copy-btn { background: #10b981; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 15px; }
    </style>
</head>
<body style="background: #f5f7fa;">
    <a href="../tools.html" class="back-btn" style="position:fixed;bottom:80px;right:20px;z-index:9999;background:#3b82f6;color:white;padding:10px 20px;border-radius:8px;text-decoration:none;"><i class="fas fa-home"></i> 返回首页</a>
    
    <div class="tool-container">
        <div class="tool-header">
            <h1><i class="fab fa-linkedin" style="color: #0a66c2;"></i> LinkedIn 拓客 <span class="pro-badge">基础版</span></h1>
            <p>搜索并联系潜在客户，扩大你的外贸业务网络</p>
        </div>
        
        <div class="tool-card">
            <div class="form-row">
                <div class="form-group">
                    <label>关键词</label>
                    <input type="text" id="searchKeyword" placeholder="CEO, Purchasing Manager">
                </div>
                <div class="form-group">
                    <label>行业</label>
                    <input type="text" id="searchIndustry" placeholder="Manufacturing, Tech">
                </div>
            </div>
            
            <div class="form-group">
                <label>快速筛选</label>
                <div>
                    <span class="filter-tag active" data-filter="all">全部</span>
                    <span class="filter-tag" data-filter="ceo">CEO/决策人</span>
                    <span class="filter-tag" data-filter="purchasing">采购负责人</span>
                </div>
            </div>
            
            <button class="search-btn" onclick="searchProfiles()">
                <i class="fas fa-search"></i> 搜索潜在客户
            </button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在搜索...</p>
            </div>
            
            <div class="results-section" id="results">
                <div class="stats-row">
                    <div class="stat-item"><div class="value" id="totalResults">0</div><div class="label">总人数</div></div>
                    <div class="stat-item"><div class="value" id="decisionMakers">0</div><div class="label">决策人</div></div>
                    <div class="stat-item"><div class="value" id="connected">0</div><div class="label">已发送</div></div>
                    <div class="stat-item"><div class="value" id="replied">0</div><div class="label">已回复</div></div>
                </div>
                <div id="profilesList"></div>
            </div>
            
            <div class="locked-tip" id="lockedTip" style="display: none;">
                🔒 此功能仅对基础版及以上会员开放<br>
                <a href="../payment.html?plan=basic" style="color:#d97706;font-weight:600;">立即升级</a>
            </div>
            
            <div class="ai-section">
                <h3 style="color:#7c3aed;margin-bottom:20px;"><i class="fas fa-robot"></i> AI 深度分析 <span class="pro-badge">专业版</span></h3>
                <button class="search-btn ai-btn" id="aiAnalysisBtn" onclick="runAIAnalysis()">
                    <i class="fas fa-magic-sparkles"></i> 生成 Buyer Intelligence Report
                </button>
                <div class="locked-tip" id="aiLockedTip" style="display:none;margin-top:15px;">
                    🔒 此功能仅对专业版会员开放<br>
                    <a href="../payment.html?plan=pro" style="color:#d97706;font-weight:600;">立即升级</a>
                </div>
                <div id="aiResult" style="display:none;margin-top:20px;"></div>
                <div class="loading" id="aiLoading" style="display:none;">
                    <div class="spinner" style="border-top-color:#7c3aed;"></div>
                    <p>🤖 AI 分析中...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const loggedIn = localStorage.getItem('tradeweb_logged_in');
        if (!loggedIn) { alert('请先登录'); window.location.href='../login.html'; }
        
        const currentUser = JSON.parse(localStorage.getItem('tradeweb_current_user') || '{}');
        const userRole = localStorage.getItem('tradeweb_user_role');
        let userPlan = currentUser.plan || 'free';
        if (userRole === 'admin') userPlan = 'pro';
        
        if (userPlan === 'free') {
            document.getElementById('lockedTip').style.display = 'block';
            document.querySelector('.search-btn').disabled = true;
        }
        
        if (userPlan !== 'pro' && userRole !== 'admin') {
            document.getElementById('aiAnalysisBtn').style.display = 'none';
            document.getElementById('aiLockedTip').style.display = 'block';
        }
        
        document.querySelectorAll('.filter-tag').forEach(tag => {
            tag.addEventListener('click', function() {
                document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
            });
        });
        
        let selectedProfile = null;
        
        function searchProfiles() {
            if (userPlan === 'free') { alert('此功能仅对基础版及以上会员开放'); return; }
            
            const keyword = document.getElementById('searchKeyword').value.trim();
            if (!keyword && !document.getElementById('searchIndustry').value.trim()) {
                alert('请至少填写一个搜索条件'); return;
            }
            
            document.getElementById('loading').classList.add('active');
            document.getElementById('results').classList.remove('active');
            
            setTimeout(() => {
                const mockProfiles = [
                    {name:'John Smith',title:'CEO',company:'ABC Manufacturing',location:'USA'},
                    {name:'Maria Garcia',title:'Purchasing Director',company:'Tech Solutions',location:'Spain'},
                    {name:'David Chen',title:'Import Manager',company:'Global Trading',location:'Canada'},
                    {name:'Emma Wilson',title:'Sales Manager',company:'Euro Products',location:'Germany'},
                    {name:'James Brown',title:'Procurement Lead',company:'Pacific Trading',location:'Australia'}
                ];
                
                let filtered = mockProfiles;
                const f = document.querySelector('.filter-tag.active').dataset.filter;
                if(f==='ceo') filtered=mockProfiles.filter(p=>p.title.toLowerCase().includes('ceo'));
                else if(f==='purchasing') filtered=mockProfiles.filter(p=>p.title.toLowerCase().includes('purchasing')||p.title.toLowerCase().includes('procurement'));
                
                renderProfiles(filtered);
                document.getElementById('loading').classList.remove('active');
                document.getElementById('results').classList.add('active');
            }, 2000);
        }
        
        function renderProfiles(profiles) {
            document.getElementById('totalResults').textContent = profiles.length;
            document.getElementById('decisionMakers').textContent = profiles.filter(p=>p.title.toLowerCase().includes('ceo')||p.title.toLowerCase().includes('director')).length;
            
            const html = profiles.map((p, idx) => `
                <div class="profile-card" onclick="selectProfile(${idx},'${p.name}','${p.title}','${p.company}')">
                    <div class="profile-avatar">${p.name.charAt(0)}</div>
                    <div class="profile-info">
                        <div class="profile-name">${p.name}</div>
                        <div class="profile-title">${p.title}</div>
                        <div class="profile-company">${p.company} | ${p.location}</div>
                    </div>
                </div>
            `).join('');
            document.getElementById('profilesList').innerHTML = html;
        }
        
        function selectProfile(idx, name, title, company) {
            selectedProfile = {name, title, company, idx};
            document.querySelectorAll('.profile-card').forEach((c, i) => {
                c.classList.toggle('selected', i === idx);
            });
            document.getElementById('aiAnalysisBtn').innerHTML = '<i class="fas fa-magic-sparkles"></i> 分析: ' + name;
        }
        
        function runAIAnalysis() {
            if (!selectedProfile) { alert('请先选择一个联系人'); return; }
            if (userPlan !== 'pro' && userRole !== 'admin') { alert('此功能仅对专业版会员开放'); return; }
            
            document.getElementById('aiLoading').style.display = 'block';
            document.getElementById('aiResult').style.display = 'none';
            
            setTimeout(() => {
                const p = selectedProfile;
                const result = `
                    <div class="report-card">
                        <h4><i class="fas fa-chart-bar"></i> Buyer Intelligence Report</h4>
                        <div class="report-grid">
                            <div class="report-stat"><div class="value">8/10</div><div class="label">Decision Power</div></div>
                            <div class="report-stat"><div class="value">82</div><div class="label">Opportunity Score</div></div>
                        </div>
                        <div class="report-section">
                            <div class="label">Best Entry Angle</div>
                            <div class="content">Position as supply chain optimization partner, leading with cost-saving insights for ${p.company}.</div>
                        </div>
                        <div class="report-section">
                            <div class="label">Recommended LinkedIn Opening</div>
                            <div class="report-message">Hi ${p.name}, noticed your work at ${p.company}. Quick question - how are you managing supply chain challenges lately? We've helped similar companies reduce lead times by 20%. Happy to share insights if helpful. 👋</div>
                        </div>
                        <div class="report-section">
                            <div class="label">Follow-up Flow</div>
                            <div class="followup-grid">
                                <div class="followup-item"><div class="day">Day 2</div><div class="action">Follow up + value</div></div>
                                <div class="followup-item"><div class="day" style="color:#f59e0b">Day 5</div><div class="action">Share insight</div></div>
                                <div class="followup-item"><div class="day" style="color:#ef4444">Day 10</div><div class="action">Meeting request</div></div>
                            </div>
                        </div>
                    </div>
                    <div style="text-align:center;">
                        <button class="copy-btn" onclick="copyReport()"><i class="fas fa-copy"></i> 复制报告</button>
                    </div>
                `;
                document.getElementById('aiResult').innerHTML = result;
                document.getElementById('aiLoading').style.display = 'none';
                document.getElementById('aiResult').style.display = 'block';
            }, 2500);
        }
        
        function copyReport() {
            const p = selectedProfile;
            const report = `Buyer Intelligence Report
────────────────
Decision Power: 8/10
Opportunity Score: 82

Best Entry Angle:
Position as supply chain optimization partner, leading with cost-saving insights for ${p.company}.

Recommended LinkedIn Opening:
Hi ${p.name}, noticed your work at ${p.company}. Quick question - how are you managing supply chain challenges lately? We've helped similar companies reduce lead times by 20%. Happy to share insights if helpful. 👋

Follow-up Flow:
Day 2: Follow up on connection request with value add
Day 5: Share relevant industry article/insight
Day 10: Soft meeting request`;
            navigator.clipboard.writeText(report).then(() => alert('报告已复制！'));
        }
    </script>
</body>
</html>
