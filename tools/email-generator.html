<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Email Generator - GlobalTrade Pro</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .tool-container { max-width: 900px; margin: 40px auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 40px; }
        .tool-header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .tool-header p { color: #666; font-size: 1.1rem; }
        .tool-card { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #374151; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 15px; transition: border-color 0.3s; font-family: inherit; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #3b82f6; }
        .form-group textarea { min-height: 120px; resize: vertical; }
        .generate-btn { width: 100%; padding: 18px; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .generate-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(16,185,129,0.3); }
        .generate-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .result-section { display: none; margin-top: 30px; }
        .result-section.active { display: block; }
        .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .result-header h3 { font-size: 1.2rem; }
        .copy-btn { padding: 8px 16px; background: #f3f4f6; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 6px; transition: background 0.2s; }
        .copy-btn:hover { background: #e5e7eb; }
        .email-content { background: #f8fafc; padding: 25px; border-radius: 12px; border: 1px solid #e5e7eb; white-space: pre-wrap; line-height: 1.7; }
        
        .loading { text-align: center; padding: 40px; display: none; }
        .loading.active { display: block; }
        .spinner { width: 50px; height: 50px; border: 4px solid #e5e7eb; border-top-color: #10b981; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: #3b82f6; text-decoration: none; margin-bottom: 20px; }
        .back-btn:hover { text-decoration: underline; }
        
        .template-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .template-tag { padding: 6px 14px; background: #e0f2fe; color: #0284c7; border-radius: 20px; font-size: 13px; cursor: pointer; transition: background 0.2s; }
        .template-tag:hover { background: #bae6fd; }
    </style>
</head>
<body style="background: #f5f7fa;">
    <a href="tools.html" class="back-btn"><i class="fas fa-arrow-left"></i> 返回工具中心</a>
    
    <div class="tool-container">
        <div class="tool-header">
            <h1><i class="fas fa-envelope-open-text" style="color: #10b981;"></i> AI Email Generator</h1>
            <p>智能生成专业外贸开发邮件，支持多种场景和语言</p>
        </div>
        
        <div class="tool-card">
            <div class="form-row">
                <div class="form-group">
                    <label>收件人姓名</label>
                    <input type="text" id="recipientName" placeholder="例如: John Smith">
                </div>
                <div class="form-group">
                    <label>收件人公司</label>
                    <input type="text" id="recipientCompany" placeholder="例如: ABC Industries">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>邮件类型</label>
                    <select id="emailType">
                        <option value="cold">Cold Email - 首次开发信</option>
                        <option value="follow">Follow Up - 跟进邮件</option>
                        <option value="quote">Quote Request - 报价请求</option>
                        <option value="meeting">Meeting Request - 会议邀请</option>
                        <option value="thanks">Thank You - 感谢邮件</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>产品/服务</label>
                    <input type="text" id="product" placeholder="例如: 工业机械设备">
                </div>
            </div>
            
            <div class="form-group">
                <label>邮件模板</label>
                <div class="template-tags">
                    <span class="template-tag" onclick="useTemplate('intro')">自我介绍型</span>
                    <span class="template-tag" onclick="useTemplate('offer')">报价优惠型</span>
                    <span class="template-tag" onclick="useTemplate('exhibition')">展会邀请型</span>
                    <span class="template-tag" onclick="useTemplate('case')">案例分享型</span>
                    <span class="template-tag" onclick="useTemplate('new')">新品推荐型</span>
                </div>
            </div>
            
            <div class="form-group">
                <label>补充说明（可选）</label>
                <textarea id="additionalInfo" placeholder="添加任何额外信息，如：目标市场、特殊要求等"></textarea>
            </div>
            
            <button class="generate-btn" onclick="generateEmail()">
                <i class="fas fa-magic"></i> 生成专业邮件
            </button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>AI 正在生成邮件...</p>
            </div>
            
            <div class="result-section" id="result">
                <div class="result-header">
                    <h3><i class="fas fa-file-alt"></i> 生成结果</h3>
                    <button class="copy-btn" onclick="copyEmail()">
                        <i class="fas fa-copy"></i> 复制内容
                    </button>
                </div>
                <div class="email-content" id="emailContent"></div>
            </div>
        </div>
    </div>

    <script>
        // 检查登录状态
        const loggedIn = localStorage.getItem('tradeweb_logged_in');
        if (!loggedIn) {
            alert('请先登录后使用工具');
            window.location.href = '../login.html';
        }
        
        const emailTemplates = {
            intro: `Dear ${'{recipientName}'},

I hope this email finds you well.

My name is ${'{senderName}'} from GlobalTrade Pro, a professional foreign trade marketing company. I came across your company ${'{companyName}'} and was impressed by your work in the industry.

We specialize in helping companies like yours expand into international markets and generate quality leads. I'd love to share some insights that could help grow your business.

Would you be available for a brief call this week to discuss how we might be able to help?

Best regards,
${'{senderName}'}
GlobalTrade Pro`,
            
            offer: `Dear ${'{recipientName}'},

Greetings from GlobalTrade Pro!

I noticed that ${'{companyName}'} might be looking for reliable suppliers for ${'{product}'}. We're a professional manufacturer with over 10 years of experience in this field.

I'd like to offer you:
- Competitive pricing with bulk order discounts
- Quality assurance with detailed product specifications
- Fast shipping and dedicated customer support

Our current promotion: 15% off for orders placed this month!

Would you like me to send you a detailed quote?

Best regards,
${'{senderName}'}
GlobalTrade Pro`,
            
            exhibition: `Dear ${'{recipientName}'},

We are excited to invite you to visit us at [Exhibition Name]!

Date: [Dates]
Booth: [Booth Number]

This is a great opportunity to:
- See our latest products firsthand
- Discuss customized solutions for your needs
- Enjoy exclusive show discounts

We would be honored to have you visit our booth. Please let me know in advance so I can arrange a meeting.

Looking forward to meeting you!

Best regards,
${'{senderName}'}
GlobalTrade Pro`,
            
            case: `Dear ${'{recipientName}'},

I wanted to share a success story that I think would interest you.

One of our clients in the ${'{industry}'} industry increased their international inquiries by 300% within 3 months using our services. They faced similar challenges as ${'{companyName}'}.

Key results:
- 300% increase in quality leads
- 50% reduction in customer acquisition cost
- Expanded to 5 new international markets

Would you like me to share more details about how we achieved these results?

Best regards,
${'{senderName}'}
GlobalTrade Pro`,
            
            new: `Dear ${'{recipientName}'},

Exciting news from GlobalTrade Pro!

We're thrilled to introduce our latest ${'{product}'}, designed specifically for the ${'{market}'} market.

What's new:
- Enhanced features based on customer feedback
- Improved energy efficiency
- Competitive pricing

Early adopters get 20% off! Would you like a sample?

Best regards,
${'{senderName}'}
GlobalTrade Pro`
        };
        
        function useTemplate(type) {
            document.getElementById('emailType').value = type;
        }
        
        function generateEmail() {
            const recipientName = document.getElementById('recipientName').value.trim() || 'Recipient';
            const company = document.getElementById('recipientCompany').value.trim() || 'Your Company';
            const product = document.getElementById('product').value.trim() || 'our products';
            const emailType = document.getElementById('emailType').value;
            const additionalInfo = document.getElementById('additionalInfo').value.trim();
            
            document.getElementById('loading').classList.add('active');
            document.getElementById('result').classList.remove('active');
            
            setTimeout(() => {
                let content = emailTemplates[emailType] || emailTemplates.intro;
                
                content = content.replace(/{recipientName}/g, recipientName)
                                .replace(/{companyName}/g, company)
                                .replace(/{product}/g, product)
                                .replace(/{senderName}/g, 'Alex Chen');
                
                if (additionalInfo) {
                    content += `\n\n---\nAdditional: ${additionalInfo}`;
                }
                
                document.getElementById('emailContent').textContent = content;
                document.getElementById('loading').classList.remove('active');
                document.getElementById('result').classList.add('active');
            }, 1500);
        }
        
        function copyEmail() {
            const content = document.getElementById('emailContent').textContent;
            navigator.clipboard.writeText(content).then(() => {
                alert('邮件内容已复制到剪贴板！');
            });
        }
    </script>
</body>
</html>
