<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Analyzer - GlobalTrade Pro</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .tool-container { max-width: 1000px; margin: 40px auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 40px; }
        .tool-header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .tool-header p { color: #666; font-size: 1.1rem; }
        .pro-badge { display: inline-block; background: linear-gradient(135deg, #f59e0b, #d97706); color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; margin-left: 10px; }
        .tool-card { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 20px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #374151; }
        .form-group input { width: 100%; padding: 16px 20px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 16px; box-sizing: border-box; }
        .form-group input:focus { outline: none; border-color: #3b82f6; }
        
        .search-btn { width: 100%; padding: 18px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
        
        .results-section { display: none; margin-top: 30px; }
        .results-section.active { display: block; }
        
        .score-card { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .score-item { text-align: center; padding: 20px; background: #f8fafc; border-radius: 12px; }
        .score-item .score { font-size: 2.5rem; font-weight: 700; }
        .score-item .score.good { color: #10b981; }
        .score-item .score.middle { color: #f59e0b; }
        .score-item .score.bad { color: #ef4444; }
        .score-item .label { color: #64748b; font-size: 0.9rem; }
        
        .issue-list { list-style: none; }
        .issue-list li { padding: 12px 16px; border-left: 3px solid #e5e7eb; margin-bottom: 10px; background: #fafafa; border-radius: 0 8px 8px 0; }
        .issue-list li.warning { border-color: #f59e0b; }
        .issue-list li.error { border-color: #ef4444; }
        .issue-list li.success { border-color: #10b981; }
        
        .ai-section { margin-top: 30px; padding-top: 30px; border-top: 2px dashed #e5e7eb; }
        .ai-btn { background: linear-gradient(135deg, #7c3aed, #5b21b6); }
        
        .locked-tip { background: #fef3c7; border: 1px solid #fcd34d; padding: 20px; border-radius: 12px; margin-top: 20px; text-align: center; }
        
        .loading { text-align: center; padding: 40px; display: none; }
        .loading.active { display: block; }
        .spinner { width: 50px; height: 50px; border: 4px solid #e5e7eb; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .report-card { background: linear-gradient(135deg, #1e3a5f, #2d5a87); color: white; padding: 25px; border-radius: 12px; }
        .report-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .report-stat { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; text-align: center; }
        .report-stat .value { font-size: 1.8rem; font-weight: bold; }
        .report-stat .label { font-size: 0.75rem; opacity: 0.8; }
        .report-section { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .report-section .title { font-size: 0.85rem; opacity: 0.8; margin-bottom: 8px; }
        .report-revenue { background: #10b981; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: center; }
        .report-revenue .label { font-size: 0.85rem; opacity: 0.9; }
        .report-revenue .value { font-size: 1.8rem; font-weight: bold; }
        
        .copy-btn { background: #10b981; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 15px; }
    </style>
</head>
<body style="background: #f5f7fa;">
    <a href="../tools.html" class="back-btn" style="position:fixed;bottom:80px;right:20px;z-index:9999;background:#3b82f6;color:white;padding:10px 20px;border-radius:8px;text-decoration:none;"><i class="fas fa-home"></i> 返回首页</a>
    
    <div class="tool-container">
        <div class="tool-header">
            <h1><i class="fas fa-globe" style="color: #3b82f6;"></i> Website Analyzer</h1>
            <p>输入任意网站 URL，获取完整的 SEO、性能和安全性分析报告</p>
        </div>
        
        <div class="tool-card">
            <div class="form-group">
                <label>网站 URL</label>
                <input type="url" id="websiteUrl" placeholder="输入网站 URL (例如: example.com)">
            </div>
            
            <button class="search-btn" onclick="analyzeWebsite()">
                <i class="fas fa-search"></i> 开始分析
            </button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在分析网站...</p>
            </div>
            
            <div class="results-section" id="results">
                <div class="score-card">
                    <div class="score-item">
                        <div class="score" id="totalScore">-</div>
                        <div class="label">综合评分</div>
                    </div>
                    <div class="score-item">
                        <div class="score" id="seoScore">-</div>
                        <div class="label">SEO 评分</div>
                    </div>
                    <div class="score-item">
                        <div class="score" id="perfScore">-</div>
                        <div class="label">性能评分</div>
                    </div>
                    <div class="score-item">
                        <div class="score" id="securityScore">-</div>
                        <div class="label">安全评分</div>
                    </div>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <h3><i class="fas fa-lightbulb" style="color: #f59e0b;"></i> 优化建议</h3>
                    <ul class="issue-list" id="issues"></ul>
                </div>
                
                <!-- 专业版 AI 分析 -->
                <div class="ai-section">
                    <h3 style="color: #7c3aed; margin-bottom: 15px;"><i class="fas fa-robot"></i> AI 深度分析 <span class="pro-badge">专业版</span></h3>
                    
                    <div id="aiContent">
                        <button class="search-btn ai-btn" id="aiAnalysisBtn" onclick="runAIAnalysis()">
                            <i class="fas fa-magic-sparkles"></i> 生成 WEBSITE INTELLIGENCE REPORT
                        </button>
                        <div class="locked-tip" id="aiLockedTip" style="display:none;margin-top:15px;">
                            🔒 此功能仅对专业版会员开放<br>
                            <a href="../payment.html?plan=pro" style="color:#d97706;font-weight:600;">立即升级</a>
                        </div>
                    </div>
                    
                    <div class="loading" id="aiLoading" style="display:none;">
                        <div class="spinner" style="border-top-color: #7c3aed;"></div>
                        <p>🤖 AI 深度分析中...</p>
                    </div>
                    
                    <div id="aiResult" style="display:none;margin-top:20px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        const loggedIn = localStorage.getItem('tradeweb_logged_in');
        if (!loggedIn) { alert('请先登录'); window.location.href='../login.html'; }
        
        const currentUser = JSON.parse(localStorage.getItem('tradeweb_current_user') || '{}');
        const userRole = localStorage.getItem('tradeweb_user_role');
        let userPlan = currentUser.plan || 'free';
        if (userRole === 'admin') userPlan = 'pro';
        
        if (userPlan !== 'pro' && userRole !== 'admin') {
            document.getElementById('aiLockedTip').style.display = 'block';
        }
        
        function getScoreClass(score) {
            if (score >= 80) return 'good';
            if (score >= 50) return 'middle';
            return 'bad';
        }

        function analyzeWebsite() {
            const url = document.getElementById('websiteUrl').value.trim();
            if (!url) { alert('请输入网站 URL'); return; }
            
            let finalUrl = url;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                finalUrl = 'https://' + url;
            }
            
            document.getElementById('loading').classList.add('active');
            document.getElementById('results').classList.remove('active');
            
            setTimeout(() => {
                const totalScore = Math.floor(Math.random() * 30) + 65;
                const seoScore = Math.floor(Math.random() * 40) + 55;
                const perfScore = Math.floor(Math.random() * 35) + 60;
                const securityScore = Math.floor(Math.random() * 25) + 70;
                
                document.getElementById('totalScore').textContent = totalScore;
                document.getElementById('totalScore').className = 'score ' + getScoreClass(totalScore);
                document.getElementById('seoScore').textContent = seoScore;
                document.getElementById('seoScore').className = 'score ' + getScoreClass(seoScore);
                document.getElementById('perfScore').textContent = perfScore;
                document.getElementById('perfScore').className = 'score ' + getScoreClass(perfScore);
                document.getElementById('securityScore').textContent = securityScore;
                document.getElementById('securityScore').className = 'score ' + getScoreClass(securityScore);
                
                const issues = [
                    { type: 'success', text: '网站可访问，服务器响应正常' },
                    { type: 'success', text: 'HTTPS 证书有效，连接安全' },
                    { type: 'warning', text: '建议添加 Meta Description 描述标签' },
                    { type: 'warning', text: '图片建议添加 Alt 属性以提升 SEO' },
                    { type: 'warning', text: '页面加载时间可进一步优化' },
                    { type: 'error', text: '建议启用浏览器缓存' },
                    { type: 'error', text: '建议压缩 CSS 和 JavaScript 文件' }
                ];
                
                document.getElementById('issues').innerHTML = issues.map(issue => 
                    `<li class="${issue.type}">${issue.text}</li>`
                ).join('');
                
                document.getElementById('loading').classList.remove('active');
                document.getElementById('results').classList.add('active');
            }, 2000);
        }
        
        function runAIAnalysis() {
            if (userPlan !== 'pro' && userRole !== 'admin') {
                alert('此功能仅对专业版会员开放');
                return;
            }
            
            const url = document.getElementById('websiteUrl').value.trim();
            if (!url) { alert('请先输入网站 URL'); return; }
            
            let finalUrl = url;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                finalUrl = 'https://' + url;
            }
            
            document.getElementById('aiLoading').style.display = 'block';
            document.getElementById('aiResult').style.display = 'none';
            
            setTimeout(() => {
                const result = {
                    structure_score: 82,
                    content_score: 78,
                    branding_score: 90,
                    performance_score: 74,
                    mobile_score: 81,
                    conversion_score: 69
                };
                
                const displayHtml = `
                    <div class="report-card">
                        <h4 style="color: white; margin-bottom: 20px; font-size: 1.3rem;">
                            <i class="fas fa-chart-bar"></i> WEBSITE INTELLIGENCE REPORT
                        </h4>
                        
                        <div style="background: rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: 600;">
                            🌐 ${finalUrl}
                        </div>
                        
                        <div class="report-grid">
                            <div class="report-stat">
                                <div class="value" style="color: ${result.structure_score >= 80 ? '#10b981' : '#f59e0b'};">${result.structure_score}</div>
                                <div class="label">Structure</div>
                            </div>
                            <div class="report-stat">
                                <div class="value" style="color: ${result.content_score >= 80 ? '#10b981' : '#f59e0b'};">${result.content_score}</div>
                                <div class="label">Content</div>
                            </div>
                            <div class="report-stat">
                                <div class="value" style="color: ${result.branding_score >= 80 ? '#10b981' : '#f59e0b'};">${result.branding_score}</div>
                                <div class="label">Branding</div>
                            </div>
                            <div class="report-stat">
                                <div class="value" style="color: ${result.performance_score >= 80 ? '#10b981' : '#f59e0b'};">${result.performance_score}</div>
                                <div class="label">Performance</div>
                            </div>
                            <div class="report-stat">
                                <div class="value" style="color: ${result.mobile_score >= 80 ? '#10b981' : '#f59e0b'};">${result.mobile_score}</div>
                                <div class="label">Mobile UX</div>
                            </div>
                            <div class="report-stat">
                                <div class="value" style="color: ${result.conversion_score >= 80 ? '#10b981' : '#f59e0b'};">${result.conversion_score}</div>
                                <div class="label">Conversion</div>
                            </div>
                        </div>
                        
                        <div class="report-section">
                            <div class="title">Key Issues:</div>
                            <ol style="margin: 0; padding-left: 20px; font-size: 0.9rem;">
                                <li>Homepage headline unclear → Rewrite for clarity</li>
                                <li>Mobile menu hard to navigate → Simplify menu hierarchy</li>
                                <li>Contact form buried → Move to prominent position</li>
                                <li>Page speed slow → Optimize images and code</li>
                                <li>SEO missing meta descriptions → Add proper metadata</li>
                            </ol>
                        </div>
                        
                        <div class="report-section">
                            <div class="title">Priority Action Plan:</div>
                            <ol style="margin: 0; padding-left: 20px; font-size: 0.9rem;">
                                <li>Improve mobile UX (high impact)</li>
                                <li>Fix page speed & Core Web Vitals</li>
                                <li>Enhance lead capture points</li>
                                <li>Update content and messaging</li>
                                <li>Optimize SEO</li>
                            </ol>
                        </div>
                        
                        <div class="report-revenue">
                            <div class="label">Estimated Revenue Lift</div>
                            <div class="value">$1,200/month</div>
                        </div>
                        
                        <div class="report-section">
                            <div class="title">Suggested Next Steps:</div>
                            <ul style="margin: 0; padding-left: 20px; font-size: 0.9rem;">
                                <li>Contact your CRO expert</li>
                                <li>Implement high-impact changes first</li>
                                <li>Monitor analytics weekly</li>
                            </ul>
                        </div>
                    </div>
                    
                    <div style="text-align: center;">
                        <button class="copy-btn" onclick="copyReport()">
                            <i class="fas fa-copy"></i> 复制报告
                        </button>
                    </div>
                `;
                
                document.getElementById('aiResult').innerHTML = displayHtml;
                document.getElementById('aiLoading').style.display = 'none';
                document.getElementById('aiResult').style.display = 'block';
            }, 2500);
        }
        
        function copyReport() {
            const url = document.getElementById('websiteUrl').value;
            const report = `WEBSITE INTELLIGENCE REPORT
─────────────────────────

Website: ${url}

Scores:
- Structure: 82/100
- Content: 78/100
- Branding: 90/100
- Performance: 74/100
- Mobile UX: 81/100
- Conversion Potential: 69/100

Key Issues:
1. Homepage headline unclear → Rewrite for clarity
2. Mobile menu hard to navigate → Simplify menu hierarchy
3. Contact form buried → Move to top
4. Page speed slow → Optimize images
5. SEO missing meta descriptions → Add metadata

Priority Action Plan:
1. Improve mobile UX (high impact)
2. Fix page speed & Core Web Vitals
3. Enhance lead capture points
4. Update content and messaging
5. Optimize SEO

Estimated Revenue Lift: $1,200/month if CRO implemented

Suggested Next Steps:
- Contact your CRO expert
- Implement high-impact changes first
- Monitor analytics weekly`;
            navigator.clipboard.writeText(report).then(() => alert('报告已复制！'));
        }
        
        document.getElementById('websiteUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') analyzeWebsite();
        });
    </script>
</body>
</html>
