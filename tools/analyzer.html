<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Analyzer - GlobalTrade Pro</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .tool-container { max-width: 900px; margin: 40px auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 40px; }
        .tool-header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .tool-header p { color: #666; font-size: 1.1rem; }
        .tool-card { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .url-input-group { display: flex; gap: 10px; margin-bottom: 30px; }
        .url-input-group input { flex: 1; padding: 16px 20px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 16px; transition: border-color 0.3s; }
        .url-input-group input:focus { outline: none; border-color: #3b82f6; }
        .url-input-group button { padding: 16px 32px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .url-input-group button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59,130,246,0.3); }
        .results-section { display: none; }
        .results-section.active { display: block; }
        .score-card { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .score-item { text-align: center; padding: 20px; background: #f8fafc; border-radius: 12px; }
        .score-item .score { font-size: 2.5rem; font-weight: 700; }
        .score-item .score.good { color: #10b981; }
        .score-item .score.middle { color: #f59e0b; }
        .score-item .score.bad { color: #ef4444; }
        .score-item .label { color: #64748b; font-size: 0.9rem; }
        .result-section { margin-top: 30px; }
        .result-section h3 { font-size: 1.3rem; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .result-section h3 i { color: #3b82f6; }
        .issue-list { list-style: none; }
        .issue-list li { padding: 12px 16px; border-left: 3px solid #e5e7eb; margin-bottom: 10px; background: #fafafa; border-radius: 0 8px 8px 0; }
        .issue-list li.warning { border-color: #f59e0b; }
        .issue-list li.error { border-color: #ef4444; }
        .issue-list li.success { border-color: #10b981; }
        .loading { text-align: center; padding: 40px; display: none; }
        .loading.active { display: block; }
        .spinner { width: 50px; height: 50px; border: 4px solid #e5e7eb; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: #3b82f6; text-decoration: none; margin-bottom: 20px; }
        .back-btn:hover { text-decoration: underline; }
    </style>
</head>
<body style="background: #f5f7fa;">
    <a href="tools.html" class="back-btn"><i class="fas fa-arrow-left"></i> 返回工具中心</a>
    
    <div class="tool-container">
        <div class="tool-header">
            <h1><i class="fas fa-globe" style="color: #3b82f6;"></i> Website Analyzer</h1>
            <p>输入任意网站 URL，获取完整的 SEO、性能和安全性分析报告</p>
        </div>
        
        <div class="tool-card">
            <div class="url-input-group">
                <input type="url" id="websiteUrl" placeholder="输入网站 URL (例如: https://example.com)">
                <button onclick="analyzeWebsite()"><i class="fas fa-search"></i> 开始分析</button>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在分析网站...</p>
            </div>
            
            <div class="results-section" id="results">
                <div class="score-card">
                    <div class="score-item">
                        <div class="score" id="totalScore">-</div>
                        <div class="label">综合评分</div>
                    </div>
                    <div class="score-item">
                        <div class="score" id="seoScore">-</div>
                        <div class="label">SEO 评分</div>
                    </div>
                    <div class="score-item">
                        <div class="score" id="perfScore">-</div>
                        <div class="label">性能评分</div>
                    </div>
                    <div class="score-item">
                        <div class="score" id="securityScore">-</div>
                        <div class="label">安全评分</div>
                    </div>
                </div>
                
                <div class="result-section">
                    <h3><i class="fas fa-check-circle"></i> 优化建议</h3>
                    <ul class="issue-list" id="issues"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 检查登录状态
        const loggedIn = localStorage.getItem('tradeweb_logged_in');
        if (!loggedIn) {
            alert('请先登录后使用工具');
            window.location.href = '../login.html';
        }
        
        function getScoreClass(score) {
            if (score >= 80) return 'good';
            if (score >= 50) return 'middle';
            return 'bad';
        }

        function analyzeWebsite() {
            const url = document.getElementById('websiteUrl').value.trim();
            if (!url) {
                alert('请输入网站 URL');
                return;
            }
            
            let finalUrl = url;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                finalUrl = 'https://' + url;
            }
            
            document.getElementById('loading').classList.add('active');
            document.getElementById('results').classList.remove('active');
            
            // 模拟分析过程
            setTimeout(() => {
                const totalScore = Math.floor(Math.random() * 30) + 65;
                const seoScore = Math.floor(Math.random() * 40) + 55;
                const perfScore = Math.floor(Math.random() * 35) + 60;
                const securityScore = Math.floor(Math.random() * 25) + 70;
                
                document.getElementById('totalScore').textContent = totalScore;
                document.getElementById('totalScore').className = 'score ' + getScoreClass(totalScore);
                document.getElementById('seoScore').textContent = seoScore;
                document.getElementById('seoScore').className = 'score ' + getScoreClass(seoScore);
                document.getElementById('perfScore').textContent = perfScore;
                document.getElementById('perfScore').className = 'score ' + getScoreClass(perfScore);
                document.getElementById('securityScore').textContent = securityScore;
                document.getElementById('securityScore').className = 'score ' + getScoreClass(securityScore);
                
                const issues = [
                    { type: 'success', text: '网站可访问，服务器响应正常' },
                    { type: 'success', text: 'HTTPS 证书有效，连接安全' },
                    { type: 'warning', text: '建议添加 Meta Description 描述标签' },
                    { type: 'warning', text: '图片建议添加 Alt 属性以提升 SEO' },
                    { type: 'warning', text: '页面加载时间可进一步优化' },
                    { type: 'error', text: '建议启用浏览器缓存' },
                    { type: 'error', text: '建议压缩 CSS 和 JavaScript 文件' }
                ];
                
                const issuesHtml = issues.map(issue => 
                    `<li class="${issue.type}">${issue.text}</li>`
                ).join('');
                
                document.getElementById('issues').innerHTML = issuesHtml;
                
                document.getElementById('loading').classList.remove('active');
                document.getElementById('results').classList.add('active');
            }, 2000);
        }
        
        // 回车键触发分析
        document.getElementById('websiteUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') analyzeWebsite();
        });
    </script>
</body>
</html>
